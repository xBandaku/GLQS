name: Build GLQS

on:
  push:
  pull_request:

jobs:
  tests:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"
      - uses: actions/setup-node@v4
        with:
          node-version: "20"
      - name: Fetch pinned game reference
        run: |
          git init reference/nightly
          git -C reference/nightly fetch --depth 1 https://gitlab.com/kevinsmartstfg/girl-life.git 83b164f64224f1ba88fd409469c1a9379ad34f86
          git -C reference/nightly checkout --detach FETCH_HEAD
      - run: npm install --prefix build/tooling @qsp/converters@1.0.1 @qsp/wasm-engine@1.6.1 --no-audit --no-fund
      - run: python -m unittest discover -s tests -v

  compile:
    needs: tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"
      - uses: actions/setup-node@v4
        with:
          node-version: "20"
      - run: npm install --global @qsp/cli@1.0.5 --no-audit --no-fund
      - run: python build.py
      - uses: actions/upload-artifact@v4
        with:
          name: GLQS.qsp
          path: build/GLQS.qsp
