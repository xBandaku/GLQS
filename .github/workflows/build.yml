name: Build GLQS

on:
  push:
  pull_request:

jobs:
  tests:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"
      - run: python -m unittest discover -s tests -v

  compile:
    needs: tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"
      - uses: actions/setup-node@v4
        with:
          node-version: "20"
      - run: npm install --global @qsp/cli@1.0.5 --no-audit --no-fund
      - run: python build.py
      - uses: actions/upload-artifact@v4
        with:
          name: GLQS.qsp
          path: build/GLQS.qsp
